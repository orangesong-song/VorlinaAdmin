  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(166px,1fr));gap:12px;margin-top:12px}

  .mcard-thumb{height:110px;background:#F5F3EF;display:flex;align-items:center;justify-content:center;overflow:hidden}

  .edsec{border:1px solid var(--line);margin:10px 0;background:#fff}
  .edsec-h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.03)}
  .edsec-b{padding:10px 13px 13px}
  .edsec-note{font-size:12px;color:var(--muted);margin:0 0 9px}
  .edsec-h{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .edsec-h .sec-tog{margin-left:auto;font-size:10px;color:var(--muted);letter-spacing:.08em}
  .edsec.folded .edsec-b{display:none}
  /* 简单键值对一行排：面包屑项 / SEO meta / 规格参数这类「全叶子对象」不再套子框 */
  .ed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:0 18px}
  .ed-grid .ed-field{margin:7px 0}
  /* 数组的数组行模式：一行多项横排（面包屑 = 行 [名称, 链接]） */
  .ed-inline{display:flex;gap:12px}
  .ed-inline .ed-field{flex:1;margin:4px 0 6px}
  /* 分区头是唯一的「实框」，加重一点把层级压回来 */
  .edsec{margin:12px 0}
  .edsec-h{background:rgba(21,22,26,.055);font-size:12px;letter-spacing:.08em}
  .ccard{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
  .ccard-thumb{height:104px;background:#F5F3EF;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
  .ccard-thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .ccard-b{padding:10px 12px;flex:1}
  .ccard-k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
  .ccard-name{font-size:14px;line-height:1.45;margin:4px 0 5px;color:var(--ink)}
  .ccard-meta{font-size:12px;color:var(--muted)}
  .ccard-f{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
  .ccard-f .grow{margin-left:auto}
  .ed-thumb-ph{height:56px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted)}

</style>

<script>
/* ══════════════════════════════════════════════════════════════
   阶段状态（2026-09-20）：
   · ✅ 已接 Supabase Auth 真实登录 + members 成员校验（P1 第 1 步）
        非成员账号进不来；会话存 localStorage，过期用 refresh_token 自动续
   · ✅ **内容已接仓库真源**（P1 第 2 步）：16 款产品 / 6 分类 / 5 篇文章 / 9 个栏目页 /
        首页区块 / 16 份认证文件，全部从 JSON 现算；右上角 srcTag() 标明读到了几份
   · ⏳ 发布链路（Worker + GitHub Actions + 五项硬闸门）未接（P1 第 3 步）
        —— 缺的是部署凭据（GitHub token / Cloudflare），不是代码；相关页面如实显示「未接入」
   ══════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════
   Supabase 接入层 —— 与外贸作战中心**同一套做法**：
   零依赖，直接走 Auth / REST 的 HTTP 接口，不引任何 CDN 包。
   ⚠️ 下面这个 key 是 anon（公开信息，本来就随前端下发），真正的门是数据库 RLS；
      **service_role 绝不进浏览器**。发布要用的 GitHub token 只存在于 Worker Secret 里。
   ⚠️ 会话键名 'va_sb_session' 与作战中心的 'twc_sb_session' **刻意分开**：
      两个应用同域下并存时不能互相顶掉登录态。
   ══════════════════════════════════════════════════════════════ */
const SB_URL = 'https://jjmaularjtmhptbfnovd.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqbWF1bGFyanRtaHB0YmZub3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODYwMTgsImV4cCI6MjEwNDM2MjAxOH0.t5RJfF34qfiBQZaqAcp3NnCOxo_38okIAzSrJNspSrI';
const SESS_KEY = 'va_sb_session';

function sbSession(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY) || 'null') }catch(e){ return null } }
function sbSetSession(s){
  try{ s ? localStorage.setItem(SESS_KEY, JSON.stringify(s)) : localStorage.removeItem(SESS_KEY) }catch(e){}
}
function sbToken(){ const s = sbSession(); return s ? s.access_token : '' }

function sbAuthHeaders(extra){
  const h = { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + (sbToken() || SB_ANON) };
  return Object.assign(h, extra || {});
}
async function jsonOrText(res){
  const txt = await res.text();
  try{ return txt ? JSON.parse(txt) : null }catch(e){ return txt }
}
async function sbReq(path, opts){
  opts = opts || {};
  const send = () => fetch(SB_URL + path, {
    method: opts.method || 'GET', headers: sbAuthHeaders(opts.headers), body: opts.body
  });
  let res = await send();
  if (res.status === 401){
    /* 令牌过期：**先拿 refresh_token 换一次，成功就重放这次请求**。
       ⚠️ 这里绝不能一见到 401 就清会话 —— refresh_token 就存在会话里，
          先清掉等于把本来能自愈的过期降级成强制重新登录（2026-09-20 实测，T6 变红）。
          「清会话」只保留给"换了还是 401"这条路。 */
    if (!await sbRefresh()) throw new Error('会话已失效，请重新登录');
    res = await send();
    if (res.status === 401){
      sbSetSession(null);
      showLogin('登录已过期，请重新登录');
      throw new Error('会话已失效，请重新登录');
    }
  }
  const j = await jsonOrText(res);
  if (!res.ok) throw new Error('HTTP ' + res.status + '：' + ((j && (j.message || j.error_description)) || j || ''));
  return j;
}
async function sbSignIn(email, pw){
  const res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': SB_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pw })
  });
  const j = await jsonOrText(res);
  if (!res.ok || !j || !j.access_token){
    const raw = (j && (j.error_description || j.msg || j.message)) || ('HTTP ' + res.status);
    throw new Error(/invalid login credentials/i.test(String(raw)) ? '邮箱或密码不正确' : raw);
  }
  sbSetSession({
    access_token: j.access_token,
    refresh_token: j.refresh_token || '',
    user_id: (j.user && j.user.id) || '',
    email: (j.user && j.user.email) || email,
    expires_at: Date.now() + ((j.expires_in || 3600) * 1000)
  });
  return j;
}
async function sbRefresh(){
  const s = sbSession();
  if (!s || !s.refresh_token) return false;
  const res = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST',
    headers: { 'apikey': SB_ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: s.refresh_token })
  });
  const j = await jsonOrText(res);
  if (!res.ok || !j || !j.access_token){ sbSetSession(null); return false }
  sbSetSession({
    access_token: j.access_token,
    refresh_token: j.refresh_token || s.refresh_token,
    user_id: (j.user && j.user.id) || s.user_id,
    email: (j.user && j.user.email) || s.email,
    expires_at: Date.now() + ((j.expires_in || 3600) * 1000)
  });
  return true;
}

/* ── 成员校验 ──────────────────────────────────────────────────
   「是不是有效成员」的**唯一判据** = members 表里存在 auth_user_id = 当前会话用户 的行。
   查不到就拒绝 —— 这一条同时挡住了「自己注册一个账号混进来」。
   ⚠️ 它挡不住的是「绕过本页面、拿 anon key + 自己注册的 JWT 直连 REST 读 inquiries」

/* ── 内容接入层（P1 第 2 步 · 2026-09-20）──────────────────────────
   内容真源 = 仓库里的 JSON。两条路的返回**形状完全一致**（GitHub Contents API 的 file 对象），
   所以切换只是 CONTENT_BASE 一个常量：
       生产  https://notify.vorlina.net        ← Worker 自定义域（*.workers.dev 在大陆被墙，必走自定义域）
       本地  ''（同源）= tools/serve-local.py 的同形桩；可用 ?cb=<地址> 或 localStorage.va_content_base 覆盖
   ! GitHub token 只存在于 Worker Secret —— CONTENT_BASE 里存的只是 Worker 的**地址**，不是凭据。
   ! 「保存」不等于「上线」：本地保存落 .local-drafts/（不碰官网工作区），
      生产保存落 cms 分支（不碰 main）。两条路语义一致：改完还要人工确认发布。
   ! 内容读失败**必须报出来**：能读多少显示多少 + 总览列出读不到的清单，
      绝不用演示数据冒充真数据（本站已为此翻车三次）。 */

const CONTENT_BASE = (function(){
  const q = new URLSearchParams(location.search).get('cb');
  if (q) return q.replace(/\/+$/, '');
  try { const ls = localStorage.getItem('va_content_base'); if (ls) return ls; } catch(e){}
  return 'https://notify.vorlina.net';   // 生产默认：Worker 自定义域（*.workers.dev 在大陆被墙）
})();

  'content/home.json', 'content/common.json',

  changes:null, changesError:'', changesLoading:false,

function b64ToStr(b64){
  const bin = atob(b64); const by = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(by);
}
function strToB64(s){
  const by = new TextEncoder().encode(s); let bin = '';
  for (let i = 0; i < by.length; i++) bin += String.fromCharCode(by[i]);
  return btoa(bin);
}
async function contentFetch(url, opts){
  /* ⚠️ 不能用 Object.assign({headers:A}, opts) —— opts.headers 会把 A 整个覆盖掉，
     PUT（带 Content-Type）就丢了 Authorization → 401 missing_token（2026-09-23 线上实锤：读得到、存不了）。
     headers 必须逐键合并。 */
  const merged = Object.assign({}, opts || {});
  merged.headers = Object.assign({ Authorization: 'Bearer ' + sbToken() }, (opts && opts.headers) || {});
  const res = await fetch(url, merged);
  const txt = await res.text();
  let j = null; try { j = txt ? JSON.parse(txt) : null } catch(e){}
  if (!res.ok) throw new Error('HTTP ' + res.status + '：' + ((j && j.message) || txt || '无响应体'));
  return j;
}
async function contentGet(path){
  /* GET 幂等，值得重试；但只重试「网络层抖动」（Chrome: Failed to fetch / Safari: Load failed）——
     HTTP 级错误（401/404/502）是真实答案，重试反而掩盖问题。Worker 侧同路径已重试一次，这里是第二道保险。 */
  let lastErr = null;
  for (let i = 0; i < 3; i++) {
    try { return await contentFetch(CONTENT_BASE + '/content?path=' + encodeURIComponent(path)) }
    catch(e){
      if (!/Failed to fetch|NetworkError|Load failed/i.test(e.message)) throw e;
      lastErr = e;
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
  throw lastErr;
}
async function contentPut(path, obj, message){
  return contentFetch(CONTENT_BASE + '/content', {
    method:'PUT',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ path: path, message: message || '后台保存',
                           content: strToB64(JSON.stringify(obj, null, 2) + '\n') })
  });
}
async function loadContent(){
  STORE.errors = [];
  STORE.files = {};
  await Promise.all(CONTENT_JSON.map(async p => {
    try { STORE.files[p] = JSON.parse(b64ToStr((await contentGet(p)).content)) }
    catch(e){ STORE.files[p] = null; STORE.errors.push(p + ' -- ' + e.message) }
  }));
  try { STORE.version = b64ToStr((await contentGet('build/version.txt')).content).trim() }
  catch(e){ STORE.version = '-' }
  STORE.loadedAt = Date.now();
}
/* 询盘：直连 Supabase REST（与作战中心同一套做法）。
   ! 只读 —— 不写 status / owner_id，不提供导出（带的是买家个人信息）。 */
async function loadInquiries(){
  STORE.inquiriesError = ''; STORE.inquiries = null;
  try {
    const rows = await sbReq('/rest/v1/inquiries'
      + '?select=id,created_at,name,company,country,status'
      + '&order=created_at.desc&limit=50');
    /* ⚠️ REST 正常返回数组；但代理改写、部分错误场景会返回**对象**。
       不校验就把 {} 当数组 .map()，整个总览会崩成白屏 —— 这是回归验证抓出来的真 bug。
       宁可见到的提示是「这份数据没读到」，也不要一处异常带翻整页。 */
    if (!Array.isArray(rows)) throw new Error('返回不是数组：' + JSON.stringify(rows).slice(0, 80));
    STORE.inquiries = rows;
  } catch(e){ STORE.inquiriesError = e.message || String(e) }
}

const row = (cells, opts={}) => {
  const tds = cells.map((c,i) => {
    if (opts.dotAt === i) return `<td><span class="dot ${c[0]}">${c[1]}</span></td>`;
    const nAt = Array.isArray(opts.numAt) ? opts.numAt : (opts.numAt != null ? [opts.numAt] : []);
    if (nAt.includes(i)) return `<td class="n">${c}</td>`;
    const kAt = Array.isArray(opts.kAt) ? opts.kAt : (opts.kAt != null ? [opts.kAt] : []);
    if (kAt.includes(i))  return `<td class="k">${c}</td>`;
    return `<td class="dim">${c}</td>`;
  }).join('');
  return `<tr${opts.sel?' aria-selected="true"':''}>${tds}</tr>`;
};
const head = (cols, right=[]) => '<thead><tr>' + cols.map((c,i)=>
  `<th${right.includes(i)?' style="text-align:right"':''}>${c}</th>`).join('') + '</tr></thead>';

/* 渲染到 HTML 前统一转义 —— JSON 里写的是裸 & ，页面看到的才是 &amp; */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s){
  return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 「改」按钮：data-opened 存 [path, sub, label]，统一由全局委托打开编辑器 */

/* 页面右上角的来源标记：读了几份就说几份，读不到就标红。
   它的作用是让「这台后台连的是哪份数据」永远可见 —— 演示数据冒充真数据是本站的老毛病。 */
function srcTag(){
  const ok = CONTENT_JSON.filter(p => STORE.files[p] != null).length;

  const cls = STORE.errors.length ? ' style="color:var(--warn)"' : '';
  return '<span class="mono dim"' + cls + '>' + t + '</span>';
}
function errorsNotice(){
  if (!STORE.errors.length) return '';

function render(id){
  const v = VIEWS[id];
  if (v) return v();
  const m = META[id] || {n:id, t:''};
  return VIEWS._placeholder(id, m.n, (m.t?`<p class="p" style="margin:0 auto 12px;text-align:left;max-width:60ch">${m.t}</p>`:'') + (m.extra||''));
}

let current = 'overview';
function go(id){
  if (!SESSION) return;                   /* 门禁：没有有效会话就不渲染任何视图 */
  current = id;
  document.getElementById('view').innerHTML = render(id);
  document.getElementById('view').scrollIntoView({block:'start'});
  window.scrollTo(0,0);
  renderNav(id);
  document.querySelectorAll('#view [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  if (id === 'media'){
    bindMedia();
    if (!MEDIA.loaded && !MEDIA.loading) mediaLoad().then(() => {
      MEDIA_UPLOADED.forEach(() => {});            /* 集合已在 mediaLoad 里刷新 */
      if (current === 'media'){ document.getElementById('view').innerHTML = render('media'); bindMedia(); }
    });
  }
  if (id === 'changes' && !STORE.changes && !STORE.changesLoading && !STORE.changesError) refreshChanges();
  if (id === 'releases' && !STORE.commits && !STORE.commitsLoading && !STORE.commitsError) refreshCommits();
  location.hash = '#/' + id;
}
/* ── 门禁 ──────────────────────────────────────────────────────
   未登录时**永不**渲染主框架：app 靠 hidden 藏（admin.css 有 [hidden]{display:none!important}）。
   登录失败/非成员一律清会话 —— 不留半截登录态。 */
function showLogin(msg){
  SESSION = null;
  document.getElementById('app').hidden = true;
  document.getElementById('login').hidden = false;
  const who = document.getElementById('whoName'); if (who) who.textContent = '—';
  const wr = document.getElementById('whoRole'); if (wr) wr.textContent = 'role: —';
  loginMsg(msg || '');
}
function loginMsg(text, kind){
  const el = document.getElementById('loginMsg');
  if (!el) return;
  if (!text){ el.hidden = true; el.innerHTML = ''; return }
  el.className = 'notice' + (kind === 'gold' ? ' gold' : kind === 'safe' ? ' safe' : '');
  el.innerHTML = text;
  el.hidden = false;
}
async function enterApp(m){
  SESSION = m;
  loginMsg('');

const MEDIA = { items:[], loaded:false, loading:false, error:'', msg:'', msgKind:'', busy:false };
const MEDIA_UPLOADED = new Set();

function imgSrc(fileName, siteRel){

async function mediaLoad(){

  } catch(e){ MEDIA.error = '媒体列表读不到：' + (e && e.message || e) }

async function mediaUploadFiles(files){
  if (!files || !files.length) return;
  MEDIA.busy = true; MEDIA.msg = '正在上传 ' + files.length + ' 个文件…'; MEDIA.msgKind = '';
  rerenderMedia();
  const done = [], failed = [];
  for (const f of files){
    const fd = new FormData();
    fd.append('file', f, f.name);
    try {
      const res = await fetch(CONTENT_BASE + '/media/upload', {
        method: 'POST', headers: { Authorization: 'Bearer ' + sbToken() }, body: fd
      });
      const t = await res.text();
      let j = null; try { j = JSON.parse(t) } catch(e){}
      if (res.ok && j && j.ok){
        done.push(j.name || f.name);
        if (j.gh && !j.gh.ok) failed.push((j.name || f.name) + '（已进媒体库，但写仓库失败：' + (j.gh.error || '') + '）');
      } else {
        failed.push((f.name || '(未命名)') + '（' + ((j && j.error) || 'HTTP ' + res.status) + '）');
      }
    } catch(e){ failed.push((f.name || '(未命名)') + '（网络错误）') }
  }
  await mediaLoad();
  MEDIA.busy = false;
  const parts = [];
  if (done.length) parts.push('已上传 ' + done.length + ' 个：' + done.join('、'));
  if (failed.length) parts.push('失败 ' + failed.length + ' 个：' + failed.join('；'));
  MEDIA.msg = parts.join('　｜　');
  MEDIA.msgKind = failed.length ? 'gold' : 'safe';
  rerenderMedia();
}
function rerenderMedia(){

function bindMedia(){
  const zone = document.getElementById('mzone');
  const input = document.getElementById('mfile');
  const pick = document.getElementById('mpick');
  if (!zone) return;
  if (pick) pick.onclick = () => input && input.click();
  if (input) input.onchange = () => { mediaUploadFiles(Array.from(input.files || [])); input.value = '' };
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.add('hot');
  }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); zone.classList.remove('hot');
  }));
  zone.addEventListener('drop', e => {
    const fs = e.dataTransfer && e.dataTransfer.files;
    if (fs && fs.length) mediaUploadFiles(Array.from(fs));
  });
  document.querySelectorAll('#view [data-copy]').forEach(b => b.onclick = async () => {
    const t = b.dataset.copy;
    try { await navigator.clipboard.writeText(t) } catch(e){ window.prompt('复制这个文件名：', t) }
    const old = b.textContent; b.textContent = '已复制'; setTimeout(() => { b.textContent = old }, 1200);

    const key = b.dataset.mdel;
    if (!confirm('从后台媒体库移除这个文件？\\n\\n' + key + '\\n\\n仓库里的同名文件不会被删除。')) return;
    try {
      const res = await fetch(CONTENT_BASE + '/media/file/' + key.split('/').map(encodeURIComponent).join('/'),
        { method: 'DELETE', headers: { Authorization: 'Bearer ' + sbToken() } });
      const j = await res.json().catch(() => ({}));
      MEDIA.msg = (j && j.ok) ? '已移除：' + key : '移除失败：' + ((j && j.error) || res.status);
      MEDIA.msgKind = (j && j.ok) ? 'safe' : 'gold';
    } catch(e){ MEDIA.msg = '移除失败：' + (e && e.message || e); MEDIA.msgKind = 'gold' }

function openPick(pathStr){
  if (!ED) return;
  PICK.path = JSON.parse(pathStr);
  ensurePickDom();
  document.getElementById('pickMask').hidden = false;
  document.getElementById('pickPanel').hidden = false;
  document.getElementById('pickBody').innerHTML = '<p class="dim">加载图库中…</p>';
  mediaLoad().then(renderPickGrid).catch(renderPickGrid);
}
function closePick(){
  const m = document.getElementById('pickMask'), p = document.getElementById('pickPanel');
  if (m) m.hidden = true;
  if (p) p.hidden = true;
  PICK.path = null;
}
function pickItems(){
  const out = [], seen = new Set();
  (MEDIA.items || []).forEach(it => {
    const n = it.name || '';
    if (!/\.(webp|jpe?g|png|avif|gif|svg)$/i.test(n) || seen.has(n)) return;
    seen.add(n);
    out.push({ name:n, url: CONTENT_BASE + '/media/file/img/' + encodeURIComponent(n), tag:'已上传' });
  });
  repoImageList().forEach(([src, url]) => {
    const n = baseName(src);
    if (!n || seen.has(n)) return;
    seen.add(n);
    out.push({ name:n, url: imgSrc(src, url), tag:'仓库图' });
  });
  return out;
}
function renderPickGrid(){
  const body = document.getElementById('pickBody');
  if (!body) return;
  const items = pickItems();
  const note = MEDIA.error ? '<p class="dim">' + esc(MEDIA.error) + '</p>' : '';
  body.innerHTML = note + (items.length
    ? '<div class="pick-grid">' + items.map(it =>
        '<button type="button" class="pick-item" data-pickitem="' + escAttr(it.name) + '" title="点击填入">'
        + '<img src="' + escAttr(it.url) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
        + '<div class="pn">' + esc(it.name) + '</div><div class="pk">' + it.tag + '</div></button>'
      ).join('') + '</div>'
    : '<p class="dim">图库是空的 —— 点左上角「上传新图」先传一张。</p>');
}
function edImgMap(){
  const out = {};
  const img = STORE.files['build/data/imagery.json'];
  const sku = ED && ED.doc ? ED.doc.sku : null;
  if (img && sku && img[sku] && img[sku].items) for (const it of img[sku].items) out[it.src] = it.url;
  return out;
}
function edThumb(fn, map, hero){
  const u = map[fn];
  if (!u) return '<div class="ed-thumb' + (hero ? ' hero' : '') + '"><span class="mono dim">' + esc(fn) + '<br>（图库未匹配）</span></div>';
  return '<div class="ed-thumb' + (hero ? ' hero' : '') + '"><img src="' + escAttr(imgSrc(u, u)) + '" loading="lazy" onerror="this.style.display=\'none\'"><span class="mono">' + esc(fn) + '</span></div>';
}
function edImagePreviewsHTML(imagesObj){
  const map = edImgMap();
  const hero = imagesObj && imagesObj.hero ? edThumb(imagesObj.hero, map, true) : '';
  const usables = (imagesObj && imagesObj.usable ? imagesObj.usable : []).map(fn => edThumb(fn, map, false)).join('');
  return '<div class="ed-imgs"><div class="ed-imgs-h">当前图（缩略图取自 imagery 图库 · 改文件名须与图库一致）</div>'
    + '<div class="ed-thumb-row">' + hero + usables + '</div></div>';
}
/* 某型号的主图 URL：imagery 图库按 sku 归组，hero 优先，取不到退回画廊第一张 */
function prodImgMap(sku){
  const out = {};
  const img = STORE.files['build/data/imagery.json'];
  if (img && sku && img[sku] && img[sku].items) for (const it of img[sku].items) out[it.src] = it.url;
  return out;
}
function prodHeroUrl(p){
  const map = prodImgMap(p && p.sku);
  const im = (p && p.images) || {};
  const fn = im.hero || ((im.usable || [])[0]);
  const u = fn ? map[fn] : '';
  return u ? imgSrc(u, u) : '';
}
/* ── 产品分区表单（vadmin-010）──────────────────────────────
   白名单字段按「运营看得懂的分区」分组；数组 / 嵌套对象仍复用通用 edNodeHTML，
   保证 增 / 删 / 调序 / 复制 的操作与保存路径完全一致（一份逻辑，不写第二套）。 */
function edFieldRow(path, label, origKey, val){
  return '<label class="ed-field"><span class="ed-k">' + esc(label) + edKeyTag(label, origKey) + '</span>'
    + edLeafHTML(path, val) + '</label>';
}
function edArea(path, val, rows){
  return '<textarea class="ed-in" rows="' + (rows || 3) + '" data-ed="' + escAttr(JSON.stringify(path)) + '">'
    + esc(val == null ? '' : String(val)) + '</textarea>';
}
function edSec(title, note, body){
  return '<div class="edsec"><div class="edsec-h" data-sec title="点击收起 / 展开">'
    + '<span>' + esc(title) + '</span><span class="sec-tog">− 收起</span></div><div class="edsec-b">'
    + (note ? '<div class="edsec-note">' + note + '</div>' : '') + body + '</div></div>';
}
function edRoRow(label, val){
  return '<div class="ed-ro" title="结构键：改动会牵动页面链接与归组，只读">' + esc(label)
    + ' · <span class="mono">' + esc(String(val == null ? '' : val).slice(0, 60)) + '</span> · 只读</div>';
}
function edThumbDirect(url, fn, hero){
  return '<div class="ed-thumb' + (hero ? ' hero' : '') + '">'
    + '<img src="' + escAttr(url) + '" loading="lazy" onerror="this.style.display=\'none\'">'
    + '<span class="mono">' + esc(fn) + '</span></div>';
}
function edHeroStrip(imgs){
  const map = edImgMap();
  const list = (imgs.usable || []).slice();
  if (imgs.hero && list.indexOf(imgs.hero) < 0) list.unshift(imgs.hero);
  return '<div class="ed-thumb-row">' + list.map(fn => {
    const u = map[fn], isHero = (fn === imgs.hero);
    return '<div class="ed-thumb' + (isHero ? ' hero' : '') + '">'
      + (u ? '<img src="' + escAttr(IMG_BASE + u) + '" loading="lazy" onerror="this.style.display=\'none\'">'
           : '<div class="ed-thumb-ph">图库未匹配</div>')
      + '<span class="mono">' + esc(fn) + '</span>'
      + (isHero ? '<span class="mono" style="font-size:9px;color:var(--gold-ink)">当前主图</span>'
                : '<button class="btn ghost sm" data-hero="' + escAttr(fn) + '">设为主图</button>')
      + '</div>';
  }).join('') + '</div>';
}

    + edSec('⑤ 图片', '主图与画廊都取自本型号的 imagery 图库。', imgBody)

    + '）—— 系统识别用，不在页面编辑。</div>';

/* ── 通用分区渲染（vadmin-011）─────────────────────────────
   asSec=true：每个键一个分区卡片（整页编辑时用，如栏目页 meta / pageHead / 各区块）；
   asSec=false：键平铺在一个分区里（编辑首页某个区块时用，免得 12 个字段切成 12 个分区）。
   隐藏与只读沿用 vadmin-008 的白名单判据；增 / 删 / 调序仍走通用 edNodeHTML，一份逻辑不写第二套。 */
function edSectionsHTML(path, obj, sch, asSec){
  const S = sch || {};
  const hide = S.hide || [], deny = S.deny || [], F = S.fields || {}, R = S.ro || {};
  let hiddenN = 0, roRows = '', secs = '';
  for (const k of Object.keys(obj)){
    if (hide.indexOf(k) >= 0 || deny.indexOf(k) >= 0 || k.charAt(0) === '_'){ hiddenN++; continue }
    if (R[k]){ roRows += edRoRow(F[k] || R[k], obj[k]); continue }
    const lab = F[k] || ED_LABELS[k] || k;
    const subSch = (S.sub && S.sub[k]) ? S.sub[k] : null;
    const isObj = obj[k] && typeof obj[k] === 'object' && !Array.isArray(obj[k]);
    const inner = edNodeHTML(path.concat(k), obj[k], lab, subSch, k, /*bare=*/ asSec && isObj);
    secs += asSec ? edSec(lab, ED_SEC_NOTE[k] || '', inner) : inner;
  }
  let out = '';
  if (roRows) out += edSec('只读 · 结构键', '这些键牵动页面链接与归组，需要改请找管理员。', roRows);
  out += secs;
  if (hiddenN) out += '<div class="ed-ro">🔒 已隐藏 ' + hiddenN + ' 个内部字段'
    + (S.hideLabel ? '（' + esc(S.hideLabel) + '）' : '') + ' —— 系统识别用，不在页面编辑。</div>';
  return out || '<div class="ed-ro">（这份内容里没有可编辑字段）</div>';
}
function edGenericHTML(){
  const v = edGet(ED.doc, ED.sub);
  const sch = edSchemaFor(ED.path, ED.sub);
  if (v && typeof v === 'object' && !Array.isArray(v)){
    if (!ED.sub.length) return edSectionsHTML(ED.sub, v, sch, true);      /* 整页：顶层键各占一区 */
    const topKey = ED.sub[ED.sub.length - 1];
    const lab = (sch && sch.fields && sch.fields[topKey]) || ED_LABELS[topKey] || topKey;
    return edSec(lab, ED_SEC_NOTE[topKey] || '', edSectionsHTML(ED.sub, v, sch, false));
  }
  return edSectionsHTML(ED.sub, v, sch, false);
}
/* 分类分区表单：① 首页分类卡 ② 分类名与导语 ③ 卖点要点 ④ 只读 slug */

function edKind(){
  if (!ED) return '';
  if (ED.path === 'data/products.json'){
    if (ED.sub[0] === 'products') return 'product';
    if (ED.sub[0] === 'categories') return 'category';
  }
  if (ED.path === 'build/data/insights.json' && ED.sub[0] === 'notes') return 'note';
  return 'generic';
}
/* 全叶子对象：键对应的值全是字符串 / 数字 / 布尔 / null，且键数在 10 个以内。
   这类对象（面包屑的 {0,1}、SEO meta、规格参数）再套一层框纯属噪音 —— 直接排网格。 */
function edIsLeafObj(v){
  const ks = Object.keys(v);
  if (!ks.length || ks.length > 10) return false;
  return ks.every(k => {
    const x = v[k];
    return x === null || typeof x === 'string' || typeof x === 'number' || typeof x === 'boolean';
  });
}
function edNodeHTML(path, v, keyLabel, sch, origKey, bare){
  if (v && typeof v === 'object' && !Array.isArray(v)){
    const S = sch || {};
    const hide = S.hide || [], deny = S.deny || [], F = S.fields || {}, R = S.ro || {};
    let hiddenN = 0;
    /* ── 紧凑分支：全叶子对象 —— 同样的 hide / deny / ro 判据，只换渲染容器 ── */
    if (edIsLeafObj(v)){
      const cells = [];
      for (const k of Object.keys(v)){
        if (hide.indexOf(k) >= 0 || deny.indexOf(k) >= 0 || k.charAt(0) === '_'){ hiddenN++; continue }
        const lab = F[k] || ED_LABELS[k] || k;
        if (R[k]){ cells.push(edRoRow(F[k] || R[k], v[k])); continue }
        cells.push('<label class="ed-field"><span class="ed-k">' + esc(lab) + edKeyTag(lab, k) + '</span>'
          + edLeafHTML(path.concat(k), v[k]) + '</label>');
      }
      return '<div class="ed-grid">' + cells.join('') + '</div>'
        + (hiddenN ? '<div class="ed-ro">🔒 已隐藏 ' + hiddenN + ' 个内部字段'
            + (S.hideLabel ? '（' + esc(S.hideLabel) + '）' : '') + ' —— 系统识别用，不在页面编辑。</div>' : '');
    }
    const kids = Object.keys(v).map(k => {
      if (hide.indexOf(k) >= 0 || deny.indexOf(k) >= 0 || k.charAt(0) === '_'){ hiddenN++; return ''; }
      if (R[k])
        return '<div class="ed-ro" title="结构键：改动会牵动页面链接与归组，只读">' + esc(F[k] || R[k]) + ' · <span class="mono">' + esc(String(v[k]).slice(0,60)) + '</span> · 只读</div>';
      return edNodeHTML(path.concat(k), v[k], F[k] || ED_LABELS[k] || k, (S.sub && S.sub[k]) ? S.sub[k] : null, k);
    }).join('')
      + (S.hasImagePreview && v.images ? edImagePreviewsHTML(v.images) : '')
      + (hiddenN ? '<div class="ed-ro">🔒 已隐藏 ' + hiddenN + ' 个内部字段' + (S.hideLabel ? '（' + esc(S.hideLabel) + '）' : '') + '—— 系统识别用，不在页面编辑。</div>' : '');
    /* bare：外层分区卡片已经标过这个名字了，内层不再重复一遍标题（只留内容） */
    return bare ? kids
      : '<div class="ed-obj"><div class="ed-obj-h">' + esc(keyLabel) + edKeyTag(keyLabel, origKey) + '</div>' + kids + '</div>';
  }
  if (Array.isArray(v)){
    const lp = escAttr(JSON.stringify(path));
    /* ── 行模式：数组的数组且内层全是叶子（面包屑 / 表格式数据）──
       一层框 + 每行横排，不再「项 → 数组 → 项」三层套娃；
       路径 data-ed 仍是 [.., i, j]，编辑与增删调序逻辑与通用数组完全一致。 */
    if (v.length && v.every(x => Array.isArray(x))
        && v.every(inner => inner.every(x => x === null || typeof x !== 'object'))){
      const opsRow = i => '<span class="ed-ops">'
        + '<button class="btn ghost" data-edop="up" data-edlist="' + lp + '" data-edi="' + i + '" title="上移">↑</button>'
        + '<button class="btn ghost" data-edop="down" data-edlist="' + lp + '" data-edi="' + i + '" title="下移">↓</button>'
        + '<button class="btn ghost" data-edop="dup" data-edlist="' + lp + '" data-edi="' + i + '">复制</button>'
        + '<button class="btn ghost risk" data-edop="del" data-edlist="' + lp + '" data-edi="' + i + '">删</button></span>';
      const rows = v.map((inner, i) =>
        '<div class="ed-item"><div class="ed-item-h">行 ' + (i + 1) + opsRow(i) + '</div><div class="ed-inline">'
        + inner.map((x, j) => '<label class="ed-field"><span class="ed-k">'
          + esc(ED_LABELS[String(j)] || String(j)) + '</span>'
          + edLeafHTML(path.concat(i, j), x) + '</label>').join('')
        + '</div></div>').join('');
      const addRow = '<button class="btn ghost sm" data-edop="add" data-edlist="' + lp + '">＋插入一行</button>';
      return '<div class="ed-obj"><div class="ed-arr-h">' + esc(keyLabel) + edKeyTag(keyLabel, origKey)
        + ' · ' + v.length + ' 行　' + addRow + '</div>'
        + (rows || '<div class="ed-ro">（空列表 —— 点「插入一行」新增）</div>') + '</div>';
    }
    const items = v.map((it, i) => {
      const ops = '<span class="ed-ops">'
        + '<button class="btn ghost" data-edop="up" data-edlist="' + lp + '" data-edi="' + i + '" title="上移">↑</button>'
        + '<button class="btn ghost" data-edop="down" data-edlist="' + lp + '" data-edi="' + i + '" title="下移">↓</button>'
        + '<button class="btn ghost" data-edop="dup" data-edlist="' + lp + '" data-edi="' + i + '">复制</button>'
        + '<button class="btn ghost risk" data-edop="del" data-edlist="' + lp + '" data-edi="' + i + '">删</button></span>';
      return '<div class="ed-item"><div class="ed-item-h">项 ' + i + ops + '</div>'
        + edNodeHTML(path.concat(i), it, String(i)) + '</div>';
    }).join('');
    const add = '<button class="btn ghost sm" data-edop="add" data-edlist="' + lp + '">＋插入一项</button>';
    return '<div class="ed-obj"><div class="ed-arr-h">' + esc(keyLabel) + edKeyTag(keyLabel, origKey) + ' · ' + v.length + ' 项　' + add + '</div>'
      + (items || '<div class="ed-ro">（空列表 —— 点「插入一项」新增）</div>') + '</div>';
  }
  return '<label class="ed-field"><span class="ed-k">' + esc(keyLabel) + '</span>' + edLeafHTML(path, v) + '</label>';
}
function openEd(path, sub, label){
  if (!STORE.files[path]){ alert('这份内容还没读到，无法编辑。请先回总览确认真源读取正常。'); return }
  const s0 = edSchemaFor(path, sub || []);
  if (s0 && s0.locked){ alert(s0.hideLabel || '该文件为系统识别用，不在页面上编辑。'); return }
  ED = { path, sub: sub || [], label: label || path,
         doc: JSON.parse(JSON.stringify(STORE.files[path])),
         message: '后台编辑 · ' + (label || path) };
  document.getElementById('edMsg').textContent = '';
  edRender();
}
function edRender(){
  if (!ED) return;
  document.getElementById('edTitle').textContent = ED.label + '　·　' + ED.path;
  const k = edKind();
  document.getElementById('edBody').innerHTML =
      k === 'product'  ? edProductHTML()
    : k === 'category' ? edCategoryHTML()
    : k === 'note'     ? edNoteHTML()
    :                    edGenericHTML();
  document.getElementById('edWrap').hidden = false;
}
function closeEd(){ ED = null; document.getElementById('edWrap').hidden = true }
async function saveEd(){
  if (!ED) return;
  const btn = document.getElementById('edSave');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '保存中…';
  document.getElementById('edMsg').textContent = '';
  try {
    await contentPut(ED.path, ED.doc, ED.message);
    STORE.files[ED.path] = JSON.parse(JSON.stringify(ED.doc));
    document.getElementById('edMsg').innerHTML = '<b style="color:var(--ok)">已保存到草稿（cms 分支）。</b>还没上线 —— 去「变更清单」过目后点发布。';
  } catch(e){
    document.getElementById('edMsg').innerHTML = '<b style="color:var(--warn)">保存失败：</b>' + esc(e.message || String(e));
  } finally { btn.disabled = false; btn.textContent = old }
}

/* ── 变更对比 / 发布历史 / 发布动作 ─────────────────────────── */
async function refreshChanges(){
  STORE.changesLoading = true; STORE.changesError = ''; STORE.changes = null; STORE.publishMsg = '';
  if (current === 'changes') go('changes');
  try {
    const j = await contentFetch(CONTENT_BASE + '/changes', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths: CONTENT_JSON })
    });
    STORE.changes = j.files || [];
  } catch(e){ STORE.changesError = e.message || String(e) }
  STORE.changesLoading = false;
  if (current === 'changes') go('changes');
}
async function refreshCommits(){
  STORE.commitsLoading = true; STORE.commitsError = ''; STORE.commits = null;
  if (current === 'releases') go('releases');
  try {
    const j = await contentFetch(CONTENT_BASE + '/commits?per=12');
    STORE.commits = j.commits || [];
  } catch(e){ STORE.commitsError = e.message || String(e) }
  STORE.commitsLoading = false;
  if (current === 'releases') go('releases');
}
async function doPublish(action){
  if (action === 'rollback'){
    if (!canRollback()){ alert('回滚仅 boss 可用'); return }
    if (!confirm('回滚会把线上整体退回旧版（草稿将被线上内容覆盖，可能连带撤掉别人刚发布的内容）。确认回滚？')) return;
  } else {
    if (!confirm('发布 = 把草稿（cms 分支）合入 main 并触发构建，六项闸门全过才上线，约 2-3 分钟。确认发布？')) return;
  }
  try {
    const j = await contentFetch(CONTENT_BASE + '/publish', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action || 'publish' })
    });
    STORE.publishMsg = j.dispatched
      ? '已触发构建（' + new Date().toLocaleTimeString('zh-CN') + '）。约 2-3 分钟后上线；完成后回本页点「刷新对比」，草稿与线上应变为一致，版本串也会更新。'
      : '返回异常：' + JSON.stringify(j).slice(0, 160);
  } catch(e){ STORE.publishMsg = '发布失败：' + (e.message || String(e)) }
  if (current === 'changes') go('changes');
}

/* ── 编辑器 / 变更按钮的全局事件委托 ─────────────────────────── */
document.addEventListener('input', e => {
  if (!ED) return;
  const el = e.target.closest('[data-ed]');
  if (!el) return;
  let v = el.value;
  if (el.dataset.edtype === 'num'){ const n = Number(v); if (v.trim() !== '' && !isNaN(n)) v = n; }
  if (el.dataset.edtype === 'bool') v = (v === 'true');
  edSet(ED.doc, JSON.parse(el.dataset.ed), v);
});
document.addEventListener('click', e => {
  const secH = e.target.closest('[data-sec]');
  if (secH){
    const box = secH.parentElement; if (!box) return;
    const folded = box.classList.toggle('folded');
    const tog = secH.querySelector('.sec-tog');
    if (tog) tog.textContent = folded ? '＋展开' : '− 收起';
    return;
  }
  const opener = e.target.closest('[data-opened]');
  if (opener){ const a = JSON.parse(opener.dataset.opened); openEd(a[0], a[1], a[2]); return }
  const act = e.target.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a === 'refreshChanges') refreshChanges();
    if (a === 'refreshCommits') refreshCommits();
    if (a === 'publish') doPublish('publish');
    if (a === 'rollback') doPublish('rollback');
    return;
  }
  const pickBtn = e.target.closest('[data-pick]');
  if (pickBtn){ openPick(pickBtn.dataset.pick); return }
  const pickItem = e.target.closest('[data-pickitem]');
  if (pickItem && PICK.path){
    edSet(ED.doc, PICK.path, pickItem.dataset.pickitem);
    closePick(); edRender(); return;
  }
  if (!ED) return;
  const heroBtn = e.target.closest('[data-hero]');
  if (heroBtn){ edSet(ED.doc, ED.sub.concat(['images','hero']), heroBtn.dataset.hero); edRender(); return }
  const opBtn = e.target.closest('[data-edop]');
  if (!opBtn) return;
  const op = opBtn.dataset.edop, i = parseInt(opBtn.dataset.edi, 10);
  const arrPath = JSON.parse(opBtn.dataset.edlist);
  const list = edGet(ED.doc, arrPath);
  if (op === 'up' && i > 0){ const t = list[i-1]; list[i-1] = list[i]; list[i] = t }
  else if (op === 'down' && i < list.length - 1){ const t = list[i+1]; list[i+1] = list[i]; list[i] = t }
  else if (op === 'dup'){ list.splice(i + 1, 0, JSON.parse(JSON.stringify(list[i]))) }
  else if (op === 'del'){ if (!confirm('删除第 ' + i + ' 项？点「保存到草稿」后才会真正写入。')) return; list.splice(i, 1) }
  else if (op === 'add'){ list.push(list.length ? edBlank(JSON.parse(JSON.stringify(list[list.length - 1]))) : '') }
  else return;
  edRender();
});
document.getElementById('edClose').onclick = closeEd;
document.getElementById('edMask').onclick = closeEd;
document.getElementById('edSave').onclick = saveEd;

/* ── 启动：有会话就恢复（过期先续），没有就停在登录页 ── */
(async function boot(){
  const s = sbSession();
  if (!s || !s.access_token){ showLogin(''); return }
  /* 过期自愈（换令牌 + 重放）已经收敛到 sbReq 内部，这里只负责"最终失败就回登录页" */
  try { enterApp(await fetchMember()) }
  catch (e){ sbSetSession(null); showLogin(e.message || '请重新登录') }
})();
</script>
